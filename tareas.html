<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estación Lumina · Misiones del día</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --fondo:#0B1026;
      --texto:#F4F6FF;
      --acento:#00E5A0;
      --acento-oscuro:#00C48A;
      --tarjeta:rgba(244,246,255,0.06);
      --borde:rgba(244,246,255,0.18);
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{
      font-family:'Space Grotesk','Segoe UI',Arial,sans-serif;
      background:var(--fondo);
      color:var(--texto);
      min-height:100vh;
      padding:1.5rem 1rem 3rem;
      background-image:
        radial-gradient(circle at 20% 15%,rgba(0,229,160,0.12),transparent 40%),
        radial-gradient(circle at 85% 85%,rgba(0,229,160,0.10),transparent 40%);
      background-attachment:fixed;
    }
    .contenedor{max-width:840px;margin:0 auto;}
    h1{font-size:2.5rem;line-height:1.15;margin-bottom:.5rem;}
    h2{font-size:1.6rem;color:var(--acento);margin-bottom:1rem;}
    h3{font-size:1.2rem;}
    p{line-height:1.6;}
    .encabezado{text-align:center;margin-bottom:2rem;}
    .encabezado p{opacity:.85;}
    .barra-superior{display:flex;justify-content:space-between;align-items:center;max-width:840px;margin:0 auto 1.5rem;}
    .barra-superior a{color:var(--acento);text-decoration:none;font-weight:700;}
    .tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:1.2rem;padding:1.5rem;margin:1.25rem 0;}
    .boton{
      display:inline-block;
      background:var(--acento);
      color:#06281C;
      border:none;
      border-radius:999px;
      padding:.85rem 1.7rem;
      font-size:1rem;
      font-weight:700;
      font-family:inherit;
      cursor:pointer;
      text-decoration:none;
      box-shadow:0 0 18px rgba(0,229,160,.35);
      transition:transform .15s ease,background .15s ease;
    }
    .boton:hover{background:var(--acento-oscuro);transform:translateY(-2px);}
    .boton.secundario{background:transparent;color:var(--texto);border:2px solid var(--borde);box-shadow:none;}
    .boton.peligro{background:transparent;color:#FF5C5C;border:2px solid rgba(255,92,92,.5);box-shadow:none;padding:.45rem 1rem;font-size:.85rem;}
    .boton.peligro:hover{background:rgba(255,92,92,.15);}
    .fila-botones{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;}
    input,textarea,select{
      width:100%;
      background:rgba(244,246,255,.05);
      border:1px solid var(--borde);
      border-radius:.8rem;
      color:var(--texto);
      padding:.7rem 1rem;
      font-family:inherit;
      font-size:1rem;
    }
    input:focus,textarea:focus{outline:2px solid var(--acento);}
    label{display:block;margin:1rem 0 .3rem;opacity:.9;}
    table{width:100%;border-collapse:collapse;background:var(--tarjeta);border:1px solid var(--borde);border-radius:1rem;overflow:hidden;}
    th,td{border:1px solid var(--borde);padding:.6rem .4rem;text-align:center;font-size:.9rem;}
    th{background:rgba(0,229,160,.15);color:var(--acento);}
    .tabla-scroll{overflow-x:auto;}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;}
    .logo{width:84px;height:84px;border-radius:50%;border:3px solid var(--acento);display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:700;color:var(--acento);margin:0 auto 1rem;box-shadow:0 0 25px rgba(0,229,160,.35);background:rgba(0,229,160,.08);}
    .modo-hacker th{background-color:#87CEFA!important;color:#000!important;}
    .modo-hacker td{background-color:#FFD700!important;color:#000!important;}
    .vacio{opacity:.7;text-align:center;padding:1rem;}
    .tarea{display:flex;align-items:center;gap:.8rem;background:var(--tarjeta);border:1px solid var(--borde);border-radius:.9rem;padding:.7rem 1rem;margin:.5rem 0;}
    .tarea span{flex:1;}
    .tarea.hecha span{text-decoration:line-through;opacity:.5;}
    .tarea input[type=checkbox]{width:20px;height:20px;accent-color:var(--acento);flex:none;}
    #contador{text-align:center;opacity:.8;margin-bottom:.5rem;}
  </style>
</head>
<body>
  <div class="contenedor">
    <nav class="barra-superior">
      <a href="menu.html">← Sala de Mando</a>
      <span>Estación Lumina</span>
    </nav>

    <header class="encabezado">
      <h1>Misiones del día</h1>
      <p>Organiza las tareas de la estación, de tu clase y de tu vida.</p>
    </header>

    <section class="tarjeta">
      <label>Nueva misión</label>
      <div class="fila-botones" style="margin-top:.6rem;">
        <input id="nuevaTarea" placeholder="Ejemplo: Terminar la tarea de matemáticas" style="flex:1;">
        <button class="boton" onclick="agregarTarea()">Agregar</button>
      </div>
    </section>

    <section>
      <p id="contador"></p>
      <div id="listaTareas"></div>
    </section>
  </div>

  <script>
    let tareas = JSON.parse(localStorage.getItem('lumina_tareas') || '[]');

    function agregarTarea() {
      const input = document.getElementById('nuevaTarea');
      const texto = input.value.trim();
      if (!texto) { alert('Escribe una misión.'); return; }
      tareas.push({ id: Date.now(), texto: texto, hecha: false });
      localStorage.setItem('lumina_tareas', JSON.stringify(tareas));
      input.value = '';
      pintarTareas();
    }

    function cambiarEstado(id) {
      tareas.forEach(function (t) { if (t.id === id) t.hecha = !t.hecha; });
      localStorage.setItem('lumina_tareas', JSON.stringify(tareas));
      pintarTareas();
    }

    function eliminarTarea(id) {
      tareas = tareas.filter(function (t) { return t.id !== id; });
      localStorage.setItem('lumina_tareas', JSON.stringify(tareas));
      pintarTareas();
    }

    function pintarTareas() {
      const lista = document.getElementById('listaTareas');
      lista.innerHTML = '';
      const hechas = tareas.filter(function (t) { return t.hecha; }).length;
      document.getElementById('contador').textContent =
        hechas + ' de ' + tareas.length + ' misiones completadas';
      if (tareas.length === 0) {
        lista.innerHTML = '<p class="vacio">No hay misiones. ¡Agrega la primera!</p>';
        return;
      }
      tareas.forEach(function (t) {
        const item = document.createElement('div');
        item.className = 'tarea' + (t.hecha ? ' hecha' : '');
        const check = document.createElement('input');
        check.type = 'checkbox';
        check.checked = t.hecha;
        check.onchange = function () { cambiarEstado(t.id); };
        const span = document.createElement('span');
        span.textContent = t.texto;
        const borrar = document.createElement('button');
        borrar.textContent = 'Eliminar';
        borrar.className = 'boton peligro';
        borrar.onclick = function () { eliminarTarea(t.id); };
        item.appendChild(check);
        item.appendChild(span);
        item.appendChild(borrar);
        lista.appendChild(item);
      });
    }

    pintarTareas();
  </script>
</body>
</html>
